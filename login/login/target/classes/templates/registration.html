<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" 
        crossorigin="anonymous">
</head>

<body>
    <!-- create navigation bar  header , header -->
    <nav class="navbar navbar-inverse bg-primary navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="#" th:href="@{/}">Registration and Login Module</a>
            </div>
        </div>
    </nav>
    <br>
    <br>
    <!-- Create HTML registration form-->
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <!--success message-->
                <div th:if="${param.success}">
                    <div class="alert alert-info">You've successfully registered to your awesome app</div>
                </div>
                <h1>Registration</h1>
                <form th:action="@{/registration}" method="post" th:object="${user}">
                    <div class="form-group">
                        <label class="control-lebel" for="firstName">
                            First Name
                        </label>
                        <input id="firstName" class="form-control" th:field="*{firstName}" required
                            autofocus="autofocus" />
                    </div>
                    <div class="form-group">
                        <label class="control-lebel" for="lastName">
                            Last Name
                        </label>
                        <input id="lastName" class="form-control" th:field="*{laststName}" required
                            autofocus="autofocus" />
                    </div>
                    <div class="form-group">
                        <label class="control-lebel" for="email">
                            Email
                        </label>
                        <input id="email" class="form-control" th:field="*{email}" required autofocus="autofocus" />
                    </div>
                    <div class="form-group">
                        <label class="control-lebel" for="password">
                            Password
                        </label>
                        <input id="password" class="form-control" type="password" th:field="*{password}" required
                            autofocus="autofocus" />
                    </div>
                    <div>
                        <button type="submit" class="btn btn-success">Register</button>
                        <span>Already registered? <a href="/" th:href="@{/login}">login here</a> </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
