<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration and login App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" 
        crossorigin="anonymous">
</head>
<body>
<!-- create navigation bar  header , header -->
<nav class="navbar navbar-inverse bg-primary navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="#" th:href="@{/}">Registration and Login Module</a>
        </div>
    </div>
</nav>
<br>
<br>
<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-ofset-3">
            <h1>User Login Page</h1>
            <form th:action="@{/login}" method="post">
<!--error message-->
<div th:if="${param.error}">
    <div class="alert alert-danger" >
       Invalid User Name or Password
    </div>
    <!--logout message-->
    <div th:if="${param.logout}">
        <div class="alert alert-info">
          You have been logged out.
        </div>

    </div>
    
</div>
<div class="form-group">
    <label for="username">User Name :</label>
    <input type="text" class="form-control" id="username" name="username" placeholder="Enter email id" autofocus="autofocus" />
</div>

<div class="form-group">
    <label for="password">Password :</label>
    <input type="text" class="form-control" id="password" name="password" placeholder="Enter your password"
        autofocus="autofocus" />
</div>
<div class="form-group">
    <div class="row">
        <div class="col-sm-6 col-sm-offset-3">
            <input type="submit" name="Login-submit" id="Login-submit" class="form-control btn btn-primary" value="Log in" />

        </div>

    </div>

</div>
            </form>
            <div class="form-group">
                <span>new User? 
                    <a href="/" th:href="@{/registration}">Register here
                        
                    </a>

                </span>

            </div>

        </div>

    </div>

</div>
</body>
</html>
